name: Build Linux Debian Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        default: linux
  push:
    branches:
      - linux

permissions:
  contents: write

env:
  BUILD_VERSION_SUFFIX: linux.${{ github.run_number }}

jobs:
  arm64:
    name: Debian arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - name: Set release build version
        run: |
          node -e "const fs = require('fs'); const path = 'app/package.json'; const pkg = require('./' + path); pkg.version = pkg.version.replace(/-.*/, '') + '-' + process.env.BUILD_VERSION_SUFFIX; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"
          node -p "require('./app/package.json').version"
      - name: Package and test application in container
        uses: shiftkey/desktop-ubuntu-arm64-packaging@9be09c4b945873e6509baaf690d457aae08cf901
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-arm64
          path: |
            dist/*.deb
            dist/*.deb.sha256
          retention-days: 30
          if-no-files-found: error

  arm:
    name: Debian arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - name: Set release build version
        run: |
          node -e "const fs = require('fs'); const path = 'app/package.json'; const pkg = require('./' + path); pkg.version = pkg.version.replace(/-.*/, '') + '-' + process.env.BUILD_VERSION_SUFFIX; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"
          node -p "require('./app/package.json').version"
      - name: Package and test application in container
        uses: shiftkey/desktop-ubuntu-arm-packaging@dd75ebc57f69fdb9319ab2b0fe11b253bb1ff2a4
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-arm
          path: |
            dist/*.deb
            dist/*.deb.sha256
          retention-days: 30
          if-no-files-found: error

  amd64:
    name: Debian amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - name: Set release build version
        run: |
          node -e "const fs = require('fs'); const path = 'app/package.json'; const pkg = require('./' + path); pkg.version = pkg.version.replace(/-.*/, '') + '-' + process.env.BUILD_VERSION_SUFFIX; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"
          node -p "require('./app/package.json').version"
      - name: Package and test application in container
        uses: shiftkey/desktop-ubuntu-amd64-packaging@ea7b7a6a940a6b907b160b946439c5c7a516f9f1
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [arm64, arm, amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set release metadata
        run: |
          BASE_VERSION="$(node -p "require('./app/package.json').version.replace(/-.*/, '')")"
          RELEASE_VERSION="${BASE_VERSION}-${BUILD_VERSION_SUFFIX}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=release-${RELEASE_VERSION}" >> "$GITHUB_ENV"
      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show release assets
        run: find artifacts -maxdepth 3 -type f | sort
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: GitHub Desktop for Linux ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated Debian package release for `${{ github.sha }}` from the `linux` branch.
          files: |
            artifacts/**/*.deb
            artifacts/**/*.deb.sha256
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
